name: CI

on:
  push:
    branches: [master]
    paths-ignore: ["*.md", "*.html", "*.png", debian/**]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Our pushes and PRs run on the Mac runners with a persistent, incremental target dir; outsider PRs (bridged in by
    # the `github` bot) never touch the Mac and run on Linux.
    runs-on: ${{ (github.event_name != 'pull_request' || contains(fromJSON('["backmeupplz","renovate","claude"]'), github.event.pull_request.user.login)) && 'macos-latest' || 'ubuntu-latest' }}
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Persistent target dir (Mac)
        if: runner.os == 'macOS'
        run: |
          # One per runner instance (each runs one job at a time); wiped past 10 GB, since cargo never prunes it.
          d="$RUNNER_TOOL_CACHE/drumkit-target"
          [ ! -d "$d" ] || [ "$(du -sm "$d" | cut -f1)" -lt 10000 ] || rm -rf "$d"
          echo "CARGO_TARGET_DIR=$d" >> "$GITHUB_ENV"
      - name: ALSA headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os == 'Linux'
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: runner.os == 'Linux'
      - name: Format, clippy and tests
        run: |
          rustc --version
          cargo fmt --check
          # clippy (own target dir, so it doesn't wait on the build lock) and the test build run side by side
          CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-target}/clippy" cargo clippy --locked --all-targets > "$RUNNER_TEMP/clippy.log" 2>&1 &
          clippy=$!
          cargo test --locked --no-run
          ok=0
          wait $clippy || ok=1; cat "$RUNNER_TEMP/clippy.log"
          [ $ok = 0 ]
          cargo test --locked
